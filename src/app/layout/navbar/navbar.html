
<header class="navbar">
  <nav class="nav-container" aria-label="Main navigation">
    <a routerLink="/" class="logo">
      <span class="logo-icon">✦</span>
      <span>Event<span class="logo-accent">Tix</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-controls="nav-links"
      aria-label="Toggle navigation menu"
    >
      ☰
    </button>

    <div
      class="nav-links"
      id="nav-links"
      [class.open]="menuOpen"
    >
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeMenu()">Home</a>

      <a routerLink="/events" routerLinkActive="active" ariaCurrentWhenActive="page"
         (click)="closeMenu()">Events</a>

      @if (auth.user()) {
<a routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Overview</a>
        <a routerLink="/ticket-history" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">My Tickets</a>
        @if (auth.hasRole(['admin'])) { <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Admin</a> }
        @if (auth.hasRole(['admin', 'accounting'])) { <a routerLink="/accounting" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Accounting</a> }
        <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Profile</a>
        <button type="button" class="signup-btn" (click)="logout()">Sign out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">Login</a>
        <a routerLink="/signup" class="signup-btn" (click)="closeMenu()">Sign Up</a>
      }
    </div>
  </nav>
</header>
