<section class="toast-region" aria-label="Notifications" aria-live="polite">
  @for (item of notifications.items(); track item.id) {
    <div class="toast" [attr.data-kind]="item.kind" [attr.role]="item.kind === 'error' ? 'alert' : 'status'">
      <span class="toast-message">{{ item.message }}</span>
      <button type="button" class="toast-close" aria-label="Dismiss notification" (click)="notifications.dismiss(item.id)">×</button>
    </div>
  }
</section>
